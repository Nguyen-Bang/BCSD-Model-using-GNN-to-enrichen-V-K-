model:
  variant: baseline
  pretrained_model: hustcw/clap-asm
  revision: 620f4beba2edce172e8f35e263399716494950c9
  hidden_size: 768
  embed_dim: 768
  func_feature_dim: 132
  dropout: 0.1

data:
  data_dir: reduced_data
  preload: true
  num_workers: 0
  sampling_scale_factor: 50

training:
  batch_size: 32
  grad_accum_steps: 8
  learning_rate: 0.00005
  weight_decay: 0.01
  temperature: 0.07
  warmup_steps: 200
  max_epochs: 150
  patience: 30
  gradient_clip: 1.0
  precision: fp16
  ranking_eval_interval: 5
  checkpoint_dir: checkpoints/clap_frozen_baseline
