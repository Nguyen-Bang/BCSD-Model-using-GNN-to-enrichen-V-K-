# Three-layer transformer baseline used to initialize the frozen GNN backbone.
model:
  num_layers: 3
  hidden_size: 768
  num_heads: 12
  vocab_size: 33555
  max_seq_length: 1024
  use_function_features: true
  func_feature_dim: 132
  embed_dim: 768
  dropout: 0.1
  clap_embedding_init: true

training:
  batch_size: 32
  grad_accum_steps: 8
  fp16: true
  weight_decay: 0.01
  warmup_steps: 100
  gradient_clip: 1.0
  use_gradcache: true
  temperature: 0.07
  mlm_pretrain_epochs: 10
  mlm_learning_rate: 0.00005
  loss: joint
  lambda_contrastive: 0.7
  learning_rate: 0.00001
  head_learning_rate: 0.00005
  max_epochs: 200
  patience: 200
  ranking_eval_every: 5
  checkpoint_dir: "checkpoints/baseline_with_features"

data:
  data_dir: "reduced_data"
  preload: true
  num_workers: 0
  sampling_scale_factor: 50
